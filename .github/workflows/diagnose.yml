name: Temporary Python diagnostic

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "debug/**"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture syntax error
        run: |
          mkdir -p debug
          python -m py_compile bot.py 2> debug/syntax.txt || true
          if [ ! -s debug/syntax.txt ]; then echo "NO_SYNTAX_ERROR" > debug/syntax.txt; fi
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/syntax.txt
          git commit -m "Temporary syntax diagnostic" || exit 0
          git push
