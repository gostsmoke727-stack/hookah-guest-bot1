name: Run Telegram bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-base-${{ runner.os }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        id: syntax
        run: |
          python -m py_compile bot.py 2> /tmp/pycompile-error.txt || {
            cat /tmp/pycompile-error.txt
            exit 1
          }

      - name: Publish syntax error for diagnostics
        if: failure() && steps.syntax.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const error = fs.existsSync('/tmp/pycompile-error.txt') ? fs.readFileSync('/tmp/pycompile-error.txt', 'utf8') : 'No compiler output captured.';
            const body = 'Temporary CI diagnostic for bot.py syntax check.\n\n```text\n' + error.slice(0, 6000) + '\n```';
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'CI syntax diagnostic', body });

      - name: Check Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          test -n "$BOT_TOKEN" || { echo "BOT_TOKEN secret is not configured"; exit 1; }
          echo "Checking Telegram credentials..."
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | grep -q '"ok":true' || { echo "Telegram BOT_TOKEN check failed"; exit 1; }

      - name: Check Supabase
        env:
          SUPABASE_URL: ${{ secrets['SUPABASE_URL'] || 'https://qajbhqrqjhhlxvodnovn.supabase.co' }}
          SUPABASE_KEY: ${{ secrets['SUPABASE_KEY'] }}
        run: |
          if [ -n "$SUPABASE_KEY" ]; then
            echo "Checking Supabase..."
            curl -fsS -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" "${SUPABASE_URL}/rest/v1/guest_memory?select=user_id&limit=1" >/dev/null || { echo "Supabase check failed"; exit 1; }
          else
            echo "Supabase key not configured; running with local session memory."
          fi

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets['OPENROUTER_API_KEY'] }}
          SUPABASE_URL: ${{ secrets['SUPABASE_URL'] || 'https://qajbhqrqjhhlxvodnovn.supabase.co' }}
          SUPABASE_KEY: ${{ secrets['SUPABASE_KEY'] }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_MODEL: gemini-3.6-flash
        run: python bot.py
