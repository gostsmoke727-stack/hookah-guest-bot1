name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        id: syntax
        run: |
          python -m py_compile bot.py 2> /tmp/pycompile-error.txt || {
            cat /tmp/pycompile-error.txt
            exit 1
          }

      - name: Import check
        run: |
          python -c "import faster_whisper; from aiogram import Bot; import bot; print('Imports OK')"

      - name: Publish syntax error for diagnostics
        if: failure() && steps.syntax.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const error = fs.existsSync('/tmp/pycompile-error.txt') ? fs.readFileSync('/tmp/pycompile-error.txt', 'utf8') : 'No compiler output captured.';
            const body = 'Temporary CI diagnostic for bot.py syntax check.\n\n```text\n' + error.slice(0, 6000) + '\n```';
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'CI syntax diagnostic', body });

      - name: Check Telegram credentials
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          test -n "${BOT_TOKEN}" || { echo "BOT_TOKEN secret is not configured"; exit 1; }
          echo "Checking Telegram credentials..."
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | grep -q '"ok":true' || {
            echo "Telegram BOT_TOKEN check failed"
            exit 1
          }

      - name: Check Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -n "${SUPABASE_KEY}" ]; then
            test -n "${SUPABASE_URL}" || { echo "SUPABASE_URL secret is not configured"; exit 1; }
            echo "Checking Supabase..."
            curl -fsS               -H "apikey: ${SUPABASE_KEY}"               -H "Authorization: Bearer ${SUPABASE_KEY}"               "${SUPABASE_URL}/rest/v1/guest_memory?select=user_id&limit=1" >/dev/null || {
                echo "Supabase check failed"
                exit 1
              }
          else
            echo "Supabase key not configured; local-memory fallback remains available."
          fi
