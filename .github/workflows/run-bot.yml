name: Run Telegram bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-base-${{ runner.os }}
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets['OPENROUTER_API_KEY'] }}
          SUPABASE_URL: ${{ secrets['SUPABASE_URL'] }}
          SUPABASE_KEY: ${{ secrets['SUPABASE_KEY'] }}
          OPENROUTER_MODEL: openrouter/free
          GEMINI_MODEL: gemini-3.6-flash
        run: |
          test -n "$BOT_TOKEN" || { echo "BOT_TOKEN secret is not configured"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is not configured"; exit 1; }
          test -n "$SUPABASE_KEY" || { echo "SUPABASE_KEY secret is not configured"; exit 1; }
          echo "Checking Telegram credentials..."
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | grep -q '"ok":true' || { echo "Telegram BOT_TOKEN check failed"; exit 1; }
          echo "Checking Supabase..."
          curl -fsS -H "apikey: ${SUPABASE_KEY}" -H "Authorization: Bearer ${SUPABASE_KEY}" "${SUPABASE_URL}/rest/v1/guest_memory?select=user_id&limit=1" >/dev/null || { echo "Supabase check failed"; exit 1; }
          python -m py_compile bot.py
          python bot.py
