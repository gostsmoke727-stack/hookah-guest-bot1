name: Provision Render Worker

on:
  push:
    paths:
      - ".github/workflows/provision-render-worker.yml"
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Install Render CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
          echo "$HOME/.render/bin" >> "$GITHUB_PATH"

      - name: Authenticate and provision worker
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          render workspace set tea-db15t6ugekts73cbrjhg
          if render services --output json | grep -q '"name":"hookah-guest-bot1-worker"'; then
            echo "Worker already exists."
            exit 0
          fi
          render services create             --from srv-db16kp9srm7s73ab26m0             --name hookah-guest-bot1-worker             --type background_worker             --repo https://github.com/gostsmoke727-stack/hookah-guest-bot1.git             --branch main             --runtime python             --build-command "pip install -r requirements.txt"             --start-command "python bot.py"             --plan starter             --region frankfurt             --auto-deploy             --output json

      - name: Verify worker exists
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          render workspace set tea-db15t6ugekts73cbrjhg
          render services --output json | grep -q '"name":"hookah-guest-bot1-worker"'
          echo "Render worker provisioned."
