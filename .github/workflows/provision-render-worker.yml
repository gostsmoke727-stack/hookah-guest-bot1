name: Configure Render deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          SERVICE_ID="srv-db204puk1f9s738k2pj0"
          API="https://api.render.com/v1/services/${SERVICE_ID}"

          test -n "${RENDER_API_KEY}" || { echo "RENDER_API_KEY is missing"; exit 1; }
          test -n "${BOT_TOKEN}" || { echo "BOT_TOKEN is missing"; exit 1; }

          echo "Suspending legacy hookah-guest-bot service to prevent Telegram polling conflict..."
          curl --fail --silent --show-error --request POST \
            --url "https://api.render.com/v1/services/srv-db16kp9srm7s73ab26m0/suspend" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            >/dev/null || true

          echo "Disabling Render auto-deploy to prevent duplicate deploys..."
          curl --fail --silent --show-error --request PATCH \
            --url "${API}" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data '{"autoDeployTrigger":"off"}' \
            >/dev/null

          put_env() {
            local key="$1"
            local value="$2"
            curl --fail --silent --show-error --request PUT \
              --url "${API}/env-vars/${key}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "accept: application/json" \
              --header "content-type: application/json" \
              --data "$(python -c 'import json,sys; print(json.dumps({"value":sys.argv[1]}))' "${value}")" \
              >/dev/null
            echo "Configured ${key}"
          }

          put_env "BOT_TOKEN" "${BOT_TOKEN}"
          [ -n "${OPENROUTER_API_KEY:-}" ] && put_env "OPENROUTER_API_KEY" "${OPENROUTER_API_KEY}" || true
          [ -n "${SUPABASE_URL:-}" ] && put_env "SUPABASE_URL" "${SUPABASE_URL}" || true
          [ -n "${SUPABASE_KEY:-}" ] && put_env "SUPABASE_KEY" "${SUPABASE_KEY}" || true
          put_env "OPENROUTER_MODEL" "openrouter/free"
          put_env "WHISPER_MODEL" "tiny"

          curl --fail --silent --show-error --request PATCH \
            --url "${API}" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data '{"serviceDetails":{"healthCheckPath":"/","startCommand":"python -u bot.py"}}' \
            >/dev/null

          echo "Cancelling stale Render deploys..."
          curl --fail --silent --show-error \
            --url "${API}/deploys?limit=20" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            | jq -r '.[] | .deploy | select(.status == "queued" or .status == "build_in_progress" or .status == "update_in_progress" or .status == "pre_deploy_in_progress") | .id' \
            | while read -r deploy_id; do
                [ -z "${deploy_id}" ] && continue
                echo "Cancelling ${deploy_id}"
                curl --fail --silent --show-error --request POST \
                  --url "${API}/deploys/${deploy_id}/cancel" \
                  --header "Authorization: Bearer ${RENDER_API_KEY}" \
                  --header "accept: application/json" \
                  >/dev/null || true
              done

          echo "Starting Render deploy..."
          curl --fail --silent --show-error --request POST \
            --url "${API}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --data '{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}'
