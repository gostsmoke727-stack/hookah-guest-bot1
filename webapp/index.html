<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подробности сочетания</title>
<style>
:root{color-scheme:light dark;--bg:#0f1012;--card:#191b1f;--text:#f5f5f5;--muted:#9ea3ad;--line:#2a2d33;--accent:#e7e7e7;--accentText:#111}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f5;--card:#fff;--text:#151515;--muted:#6d7178;--line:#e5e5e5;--accent:#151515;--accentText:#fff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:18px 16px 32px}
h1{font-size:24px;margin:0 0 6px}.sub{color:var(--muted);margin-bottom:18px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 14px;border-radius:999px;white-space:nowrap}
.tab.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.title{font-size:19px;font-weight:700}.muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{border:1px solid var(--line);border-radius:12px;padding:11px}.label{color:var(--muted);font-size:12px}.value{font-weight:600;margin-top:3px}
.row{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.actions{display:flex;gap:8px;margin-top:16px}.btn{flex:1;border:0;border-radius:12px;padding:13px;background:var(--accent);color:var(--accentText);font-weight:700}
.warn{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
@media(max-width:420px){.grid{grid-template-columns:1fr}.title{font-size:18px}}
</style>
</head>
<body>
<main id="app">
<h1>Подробности</h1>
<div class="sub">Выбери вариант — здесь только состав и то, что реально нужно для забивки.</div>
<div id="tabs" class="tabs"></div>
<section id="content"></section>
</main>
<script>
(function(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand();}catch(e){}}
  const root=document.getElementById("content"),tabs=document.getElementById("tabs");
  let data={variants:[]},selected=0;
  try{
    const raw=new URLSearchParams(location.search).get("data");
    if(raw)data=JSON.parse(raw);
  }catch(e){}
  const variants=Array.isArray(data.variants)?data.variants.slice(0,3):[];
  function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
  function strength(s){return s||"не указана"}
  function renderTabs(){
    tabs.innerHTML="";
    variants.forEach((v,i)=>{
      const b=document.createElement("button");b.className="tab"+(i===selected?" active":"");
      b.textContent="№"+(i+1)+" · "+(v.name||"Вариант");
      b.type="button";b.addEventListener("click",()=>{selected=i;render()});tabs.appendChild(b);
    });
  }
  function render(){
    renderTabs();
    if(!variants.length){root.innerHTML='<div class="card">Не удалось передать варианты. Вернись в чат и сделай новый подбор.</div>';return}
    const v=variants[selected];
    const p=data.profile||{};
    let h='<div class="card"><div class="title">'+esc(v.brand)+" — "+esc(v.name)+'</div>';
    if(v.description)h+='<div class="muted" style="margin-top:6px">'+esc(v.description)+'</div>';
    h+='<div class="grid"><div class="stat"><div class="label">Направление</div><div class="value">'+esc(v.direction||"—")+'</div></div>';
    h+='<div class="stat"><div class="label">Категория</div><div class="value">'+esc(v.category||"—")+'</div></div>';
    h+='<div class="stat"><div class="label">Крепость табака</div><div class="value">'+esc(strength(v.strength))+'</div></div>';
    h+='<div class="stat"><div class="label">Чаша</div><div class="value">'+esc(p.bowl||"по умолчанию")+'</div></div></div></div>';
    if(data.pairing){
      h+='<div class="card"><div class="title">🎯 Готовое сочетание</div><div class="muted" style="margin-top:4px">'+esc(data.pairing.name)+" · "+esc(data.pairing.source)+'</div>';
      h+='<div style="margin-top:10px">';
      (data.pairing.components||[]).forEach((x,i)=>{
        const ratio=(data.pairing.ratios||[])[i]||"";
        h+='<div class="row"><span>'+esc(x.brand)+" — "+esc(x.name)+'</span><b>'+esc(ratio)+'</b></div>';
      });
      h+='</div><div class="small" style="margin-top:10px">Пропорции показаны только для проверенного опубликованного сочетания.</div></div>';
    }else{
      h+='<div class="card"><div class="title">Состав</div><div class="row"><span>'+esc(v.brand)+" — "+esc(v.name)+'</span><b>100%</b></div><div class="small">Для этого варианта нет подтверждённого многокомпонентного рецепта — пропорции микса не выдумываются.</div></div>';
    }
    h+='<div class="card"><div class="title">🥣 Забивка</div><div class="muted" style="margin-top:7px">Не перекрывай отверстия. Для классической чаши — рыхлая или полуплотная забивка; отступ около 2–3 мм. Точный вес зависит от конкретной чаши.</div>';
    h+='<div class="title" style="margin-top:16px">🔥 Жар</div><div class="muted" style="margin-top:7px">Стартуй с умеренного жара. Горчит или жёстко — снизь. Плоско — добавляй постепенно.</div></div>';
    if(Array.isArray(p.excluded)&&p.excluded.length)h+='<div class="warn">🚫 Не использую: '+esc(p.excluded.join(", "))+'</div>';
    root.innerHTML=h;
  }
  render();
})();
</script>
</body>
</html>
