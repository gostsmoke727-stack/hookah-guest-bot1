<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подробности сочетания</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;--text:#f5f5f7;--muted:#98989d;
  --line:#38383a;--accent:#0a84ff;--accentText:#fff;--danger:#ff453a;--good:#30d158;
  --radius:20px;--radius-sm:14px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;--text:#1c1c1e;--muted:#8a8a8e;
    --line:#e5e5ea;--accent:#007aff;--accentText:#fff;--danger:#ff3b30;--good:#34c759;
  }
}
:root[data-theme="light"]{
  --bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;--text:#1c1c1e;--muted:#8a8a8e;
  --line:#e5e5ea;--accent:#007aff;--accentText:#fff;--danger:#ff3b30;--good:#34c759;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  -webkit-font-smoothing:antialiased;
}
main{max-width:600px;margin:0 auto;padding:14px 16px 28px}

header{padding:10px 2px 18px}
h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin:0 0 4px}
.sub{color:var(--muted);font-size:15px}

.tabs{display:flex;gap:8px;overflow:auto;padding:4px 2px 18px;-ms-overflow-style:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:none;background:var(--card2);color:var(--text);
  padding:9px 16px;border-radius:999px;white-space:nowrap;
  font-size:15px;font-weight:590;
  transition:background .15s ease, color .15s ease, transform .1s ease;
}
.tab:active{transform:scale(.96)}
.tab.active{background:var(--accent);color:var(--accentText)}

.card{
  background:var(--card);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  animation:rise .28s cubic-bezier(.2,.8,.2,1);
}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.eyebrow{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;margin-bottom:6px}
.title{font-size:20px;font-weight:700;letter-spacing:-0.01em}
.muted{color:var(--muted);font-size:15px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--card2);border-radius:var(--radius-sm);padding:12px}
.label{color:var(--muted);font-size:12.5px;font-weight:500}
.value{font-weight:650;margin-top:3px;font-size:16px}

.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-size:15.5px}
.row .ratio{font-weight:650;background:var(--card2);padding:4px 10px;border-radius:10px;font-size:14px}

.subst{display:flex;align-items:center;gap:8px;font-size:15px;padding:10px 0;border-bottom:1px solid var(--line)}
.subst:last-child{border-bottom:0}
.subst .arrow{color:var(--muted)}

.small{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.45}

.warn{
  margin-top:4px;padding:14px 16px;border-radius:var(--radius-sm);
  background:color-mix(in srgb, var(--danger) 12%, var(--card));
  color:var(--danger);font-size:14.5px;font-weight:550;
}
.good-tag{
  display:inline-block;padding:3px 10px;border-radius:999px;
  background:color-mix(in srgb, var(--good) 15%, var(--card));
  color:var(--good);font-size:12.5px;font-weight:650;margin-bottom:8px;
}

.skeleton{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.sk-line{height:14px;border-radius:7px;background:var(--card2);margin-bottom:10px;overflow:hidden;position:relative}
.sk-line::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
  animation:shimmer 1.2s infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

@media(max-width:380px){.grid{grid-template-columns:1fr}.title{font-size:18px}h1{font-size:24px}}
</style>
</head>
<body>
<main id="app">
  <header>
    <h1>Подробности</h1>
    <div class="sub">Состав и всё, что нужно для забивки</div>
  </header>
  <div id="tabs" class="tabs"></div>
  <section id="content">
    <div class="skeleton"><div class="sk-line" style="width:60%"></div><div class="sk-line" style="width:90%"></div><div class="sk-line" style="width:40%"></div></div>
  </section>
</main>
<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){
    try{
      tg.ready(); tg.expand();
      if(tg.colorScheme) document.documentElement.setAttribute("data-theme", tg.colorScheme);
      if(tg.onEvent) tg.onEvent("themeChanged", ()=>{
        document.documentElement.setAttribute("data-theme", tg.colorScheme);
      });
    }catch(e){}
  }

  const root = document.getElementById("content");
  const tabs = document.getElementById("tabs");
  let data = {variants: []};
  let selected = 0;

  try{
    const raw = new URLSearchParams(location.search).get("data");
    if(raw) data = JSON.parse(raw);
  }catch(e){}

  const variants = Array.isArray(data.variants) ? data.variants.slice(0,3) : [];

  function esc(v){
    return String(v ?? "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }
  function haptic(style){
    if(tg && tg.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred(style||"light"); }catch(e){} }
  }
  function strength(s){ return s || "не указана"; }

  function renderTabs(){
    tabs.innerHTML = "";
    if(variants.length < 2) return;
    variants.forEach((v,i)=>{
      const b = document.createElement("button");
      b.className = "tab" + (i===selected ? " active" : "");
      b.type = "button";
      b.textContent = "№" + (i+1) + " · " + (v.name || "Вариант");
      b.addEventListener("click", ()=>{ if(selected!==i){ selected=i; haptic("light"); render(); } });
      tabs.appendChild(b);
    });
  }

  function render(){
    renderTabs();

    if(!variants.length){
      root.innerHTML = '<div class="card"><div class="title">Не удалось передать варианты</div>'
        + '<div class="muted" style="margin-top:6px">Вернись в чат и сделай новый подбор.</div></div>';
      return;
    }

    const v = variants[selected];
    const p = data.profile || {};
    const bowl = p.bowl || p.usual_bowl || "по умолчанию";

    let h = '';

    h += '<div class="card"><div class="eyebrow">' + esc(v.category || "Вкус") + '</div>';
    h += '<div class="title">' + esc(v.brand) + " — " + esc(v.name) + '</div>';
    if(v.description) h += '<div class="muted" style="margin-top:6px">' + esc(v.description) + '</div>';
    h += '<div class="grid">';
    h += '<div class="stat"><div class="label">Направление</div><div class="value">' + esc(v.direction || "—") + '</div></div>';
    h += '<div class="stat"><div class="label">Крепость</div><div class="value">' + esc(strength(v.strength)) + '</div></div>';
    h += '<div class="stat"><div class="label">Чаша</div><div class="value">' + esc(bowl) + '</div></div>';
    h += '<div class="stat"><div class="label">Категория</div><div class="value">' + esc(v.category || "—") + '</div></div>';
    h += '</div></div>';

    if(data.pairing){
      h += '<div class="card"><span class="good-tag">✓ Проверенный рецепт</span>';
      h += '<div class="title" style="font-size:17px">' + esc(data.pairing.name) + '</div>';
      h += '<div class="muted" style="margin-top:2px">' + esc(data.pairing.source) + '</div><div style="margin-top:8px">';
      (data.pairing.components || []).forEach((x,i)=>{
        const ratio = (data.pairing.ratios || [])[i] || "";
        h += '<div class="row"><span class="name">' + esc(x.brand) + " — " + esc(x.name) + '</span><span class="ratio">' + esc(ratio) + '</span></div>';
      });
      h += '</div><div class="small">Пропорции показаны только для проверенного опубликованного сочетания.</div></div>';
    } else {
      h += '<div class="card"><div class="title" style="font-size:17px">Состав</div>';
      h += '<div class="row"><span class="name">' + esc(v.brand) + " — " + esc(v.name) + '</span><span class="ratio">100%</span></div>';
      h += '<div class="small">Для этого варианта нет подтверждённого многокомпонентного рецепта — пропорции микса не выдумываются.</div></div>';
    }

    const subs = Array.isArray(v.substitutes) ? v.substitutes : [];
    if(subs.length){
      h += '<div class="card"><div class="title" style="font-size:17px">🔁 Замены</div><div style="margin-top:8px">';
      subs.forEach(s=>{
        h += '<div class="subst"><span>' + esc(s.from) + '</span><span class="arrow">→</span><span>' + esc(s.to) + '</span></div>';
      });
      h += '</div></div>';
    }

    h += '<div class="card"><div class="title" style="font-size:17px">🥣 Забивка</div>';
    h += '<div class="muted" style="margin-top:7px">Не перекрывай отверстия. Для «' + esc(bowl) + '» — рыхлая или полуплотная забивка, отступ 2–3 мм. Точный вес зависит от конкретной чаши.</div>';
    h += '<div class="title" style="font-size:17px;margin-top:16px">🔥 Жар</div>';
    h += '<div class="muted" style="margin-top:7px">Стартуй с умеренного жара. Горчит или жёстко — снизь. Плоско — добавляй постепенно.</div></div>';

    if(Array.isArray(p.excluded) && p.excluded.length){
      h += '<div class="warn">🚫 Не использую: ' + esc(p.excluded.join(", ")) + '</div>';
    }

    root.innerHTML = h;
  }

  render();
})();
</script>
</body>
</html>
